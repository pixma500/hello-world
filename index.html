<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Сокращение рациональных дробей — анимация</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/katex.min.css">
<style>
  :root {
    --green: #12b886;
    --red: #e03131;
    --fade: 0.14;
  }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans";
    background: #0b0f14;
    color: #e6edf3;
    display: grid;
    place-items: center;
    min-height: 100vh;
    margin: 0;
    padding: 24px;
  }
  .card {
    width: min(900px, 92vw);
    background: #0e1621;
    border: 1px solid #223043;
    border-radius: 14px;
    padding: 22px 22px 12px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.03);
  }
  h1 {
    font-size: 20px;
    margin: 0 0 8px;
    font-weight: 650;
    letter-spacing: 0.2px;
  }
  .subtitle {
    opacity: 0.75;
    margin-bottom: 14px;
    font-size: 13px;
  }
  .stage {
    background: #0b121b;
    border: 1px solid #1c2a3d;
    border-radius: 12px;
    padding: 24px 18px;
    min-height: 200px;
    display: grid;
    place-items: center;
    position: relative;
    overflow: hidden;
  }
  .step {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    opacity: 0;
    transform: translateY(8px) scale(0.985);
    transition: opacity 420ms ease, transform 420ms ease;
    pointer-events: none;
  }
  .step.active {
    opacity: 1;
    transform: translateY(0) scale(1);
    pointer-events: auto;
  }
  .katex-display {
    margin: 0 !important;
  }
  .controls {
    display: flex;
    gap: 10px;
    margin-top: 14px;
  }
  button {
    background: #1971c2;
    color: white;
    border: 0;
    padding: 10px 14px;
    border-radius: 10px;
    font-weight: 600;
    cursor: pointer;
    transition: transform 120ms ease, filter 120ms ease, background 120ms ease;
  }
  button:hover { filter: brightness(1.05); }
  button:active { transform: translateY(1px); }
  button.secondary {
    background: #2b3442;
  }

  /* Вспомогательные классы для анимации */
  .green { color: var(--green); }
  .cancel {
    position: relative;
    display: inline-block;
  }
  .strike .cancel::after {
    content: "";
    position: absolute;
    left: -8%;
    right: -8%;
    top: 50%;
    height: 2px;
    background: var(--red);
    transform-origin: left center;
    transform: rotate(-22deg) scaleX(0);
    transition: transform 420ms ease 50ms;
  }
  .strike .cancel.appear::after {
    transform: rotate(-22deg) scaleX(1);
  }
  .fade-canceled .cancel {
    opacity: var(--fade);
    transition: opacity 380ms ease;
  }
  .formula {
    font-size: clamp(24px, 5.5vw, 42px);
  }
  .hint {
    position: absolute;
    bottom: 10px;
    left: 14px;
    font-size: 12px;
    opacity: 0.7;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>Сокращение рациональных дробей</h1>
    <div class="subtitle">Анимация: выделяем общие множители числителя и знаменателя, зачёркиваем и записываем результат.</div>

    <div class="stage" id="stage">
      <!-- Шаг 1: исходная дробь -->
      <div class="step active" id="step1">
        <div class="formula">
          $$\frac{6x^2 y}{9xy^2}$$
        </div>
        <div class="hint">Исходная дробь</div>
      </div>

      <!-- Шаг 2: разложение на множители; общие множители зелёным -->
      <div class="step" id="step2">
        <div class="formula" id="factored">
          <!-- Рендерится KaTeX-ом ниже -->
        </div>
        <div class="hint">Разложим на множители и выделим общие</div>
      </div>

      <!-- Шаг 3: результат -->
      <div class="step" id="step3">
        <div class="formula">
          $$\frac{2x}{3y}$$
        </div>
        <div class="hint">После сокращения</div>
      </div>
    </div>

    <div class="controls">
      <button id="play">Пуск</button>
      <button class="secondary" id="again">Повтор</button>
    </div>
  </div>

<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/contrib/auto-render.min.js"></script>
<script>
  // Конфигурация: исходная дробь 6x^2 y / (9 x y^2)
  // Покажем факторизацию: 2 · (3) · (x) · x · (y) / (3) · (x) · (y) · y
  // Круглыми скобками помечены общие множители (они будут зачёркнуты)
  const factoredTeX = String.raw`
    \frac{2\cdot \class{cancel green}{3}\cdot \class{cancel green}{x}\cdot x\cdot \class{cancel green}{y}}
         {\class{cancel green}{3}\cdot \class{cancel green}{x}\cdot \class{cancel green}{y}\cdot y}
  `;

  // Рендер одной формулы с поддержкой \class (требует trust: true)
  function renderTeX(targetEl, tex) {
    katex.render(tex, targetEl, {
      displayMode: true,
      throwOnError: false,
      strict: "warn",
      trust: (ctx) => ctx.command === "\\class" || ctx.command === "\\htmlClass",
    });
  }

  function byId(id){ return document.getElementById(id); }

  function reset() {
    // Сбрасываем классы и показываем шаг 1
    for (const s of document.querySelectorAll('.step')) {
      s.classList.remove('active','strike','fade-canceled');
    }
    byId('step1').classList.add('active');
    // Перерисовать факторизацию начисто
    const factored = byId('factored');
    factored.innerHTML = "";
    renderTeX(factored, factoredTeX);
  }

  function play() {
    reset();

    const s1 = byId('step1');
    const s2 = byId('step2');
    const s3 = byId('step3');

    // Переход: шаг 1 -> шаг 2
    setTimeout(() => {
      s1.classList.remove('active');
      s2.classList.add('active');

      // Включаем зачёркивание (анимация линии)
      setTimeout(() => {
        s2.classList.add('strike');
        // Плавно проявим линии у всех .cancel по очереди
        const cancels = s2.querySelectorAll('.cancel');
        cancels.forEach((el, i) => {
          setTimeout(() => el.classList.add('appear'), i * 120);
        });

        // После зачёркивания приглушим общие множители
        setTimeout(() => {
          s2.classList.add('fade-canceled');
          // И перейдём к финальному результату
          setTimeout(() => {
            s2.classList.remove('active');
            s3.classList.add('active');
          }, 650);
        }, 850);

      }, 350);
    }, 850);
  }

  // Начальный рендер факторизации
  document.addEventListener('DOMContentLoaded', () => {
    renderTeX(byId('factored'), factoredTeX);
    byId('play').addEventListener('click', play);
    byId('again').addEventListener('click', play);
  });
</script>
</body>
</html>
